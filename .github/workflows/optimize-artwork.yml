name: Optimize landing and catastrophe artwork
on:
  push:
    branches:
      - speed-landing-and-disaster-art

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate optimized WebP cards and entrance poster
        run: node scripts/optimize-images.mjs
      - name: Commit generated image assets to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/cards/disasters public/images/ui public/card-images.js public/theme.css
          if ! git diff --cached --quiet; then
            git commit -m "Generate smaller disaster cards, previews and matching video poster"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
