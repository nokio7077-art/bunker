name: Game logic tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - name: Install media optimizer
        if: github.head_ref == 'speed-landing-and-disaster-art'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Build optimized imagery in PR branch
        if: github.head_ref == 'speed-landing-and-disaster-art'
        run: |
          node scripts/optimize-images.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/cards/disasters public/images/ui public/card-images.js public/theme.css
          if ! git diff --cached --quiet; then
            git commit -m "Generate smaller WebP disaster cards, previews and video poster"
            git push origin HEAD:speed-landing-and-disaster-art
          fi
